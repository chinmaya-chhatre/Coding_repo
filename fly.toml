# Fly.io config for HookScope. Change `app` to a unique name before `fly launch`.
app = "hookscope-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOOKSCOPE_DB = "/data/hookscope.db"
  # A public demo should not keep payloads forever.
  HOOKSCOPE_RETENTION_DAYS = "7"
  HOOKSCOPE_MAX_EVENTS = "5000"

[[mounts]]
  source = "hookscope_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
